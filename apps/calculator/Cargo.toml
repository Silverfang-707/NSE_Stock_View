[package]
name = "calculator"
version = "0.1.0"
edition = "2021"

[dependencies]

tokio = { version = "1", features = ["full"] }

sqlx = {
    version = "0.8.6",
    features = [
        "runtime-tokio-rustls",
        "postgres",
        "chrono"
    ]
}

chrono = "0.4"

dotenvy = "0.15"

serde = {
    version = "1",
    features = ["derive"]
}

anyhow = "1"

db = { path = "../../crates/db" }
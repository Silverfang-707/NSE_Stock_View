[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

tokio = { version = "1.52.3", features = ["full"] }

sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

tower-http = { version = "0.6.10", features = [
    "cors",
    "trace"
] }

dotenvy = "0.15"

market_core = { path = "../../crates/market_core" }
db = { path = "../../crates/db" }
chrono = { version = "0.4.44", features = ["serde"] }
argon2 = "0.5"
jsonwebtoken = "9"

uuid = { version = "1", features = ["v4", "serde"] }
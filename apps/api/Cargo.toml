[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]

# ─────────────────────────────
# Web Framework
# ─────────────────────────────

axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }

tower-http = { version = "0.6.10", features = [
    "cors",
    "trace"
] }

# ─────────────────────────────
# Serialization
# ─────────────────────────────

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# ─────────────────────────────
# Database
# ─────────────────────────────

sqlx = { version = "0.8.6", features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "uuid",
    "json"
] }

chrono = { version = "0.4.44", features = ["serde"] }

uuid = { version = "1", features = [
    "v4",
    "serde"
] }

# ─────────────────────────────
# Authentication
# ─────────────────────────────

argon2 = "0.5"
jsonwebtoken = "9"

# ─────────────────────────────
# Environment
# ─────────────────────────────

dotenvy = "0.15"

# ─────────────────────────────
# Logging / Debugging
# ─────────────────────────────

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter"
] }

# ─────────────────────────────
# HTTP Client
# ─────────────────────────────

reqwest = { version = "0.12", features = [
    "json",
    "rustls-tls"
] }

# ─────────────────────────────
# Internal Workspace Crates
# ─────────────────────────────

market_core = { path = "../../crates/market_core" }

db = { path = "../../crates/db" }

patterns = { path = "../../crates/patterns" }